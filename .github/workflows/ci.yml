name: CI

on:
  # Every branch, not just master. CLAUDE.md puts each track on its own
  # branch, and someone pushing to m1-core with no PR open yet still wants
  # to know their tests pass. A branch filter here would have meant CI ran
  # only once a PR existed.
  push:
  pull_request:

# A push to a branch with an open PR fires both events. Keep the newer run,
# cancel the older, so six people on six branches do not queue behind
# duplicate work.
#
# github.ref differs between the two events for the SAME branch: push gives
# refs/heads/<branch>, pull_request gives refs/pull/<PR#>/merge. Keying on
# github.ref alone puts them in different groups and neither ever cancels
# the other. github.head_ref is set only for pull_request (the source
# branch name) and empty for push, so this falls through to github.ref
# there -- same branch, same group, either way.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Installing from the pinned requirements and then installing the
      # project editable is the documented setup. If this step breaks, the
      # README is wrong for all six people, so let CI find that first.
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Tests
        run: pytest -q
