name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Installing from the pinned requirements and then installing the
      # project editable is the documented setup. If this step breaks, the
      # README is wrong for all six people, so let CI find that first.
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Tests
        run: pytest -q
